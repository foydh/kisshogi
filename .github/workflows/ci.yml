name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Compile
        run: python -m compileall -q src tests packaging scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node tests
        run: node --test tests/js/*.test.mjs

  package:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Install wheel
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/pip install dist/*.whl
          .venv-wheel/bin/kisshogi --version
          .venv-wheel/bin/python - <<'PY'
          from importlib.resources import files
          root = files("kisshogi").joinpath("web")
          assert (root / "index.html").is_file()
          assert (root / "vendor" / "tsshogi" / "index.mjs").is_file()
          assert (root / "assets" / "fonts" / "pieces.woff2").is_file()
          print("wheel assets ok")
          PY

  native-package:
    name: Linux native package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-gtk-3.0 libglib2.0-bin
          sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0
      - name: Build onefile
        run: |
          python3 -m venv --system-site-packages .venv-build
          .venv-build/bin/python -m pip install -U pip
          .venv-build/bin/pip install -e '.[native]'
          .venv-build/bin/pip install pyinstaller
          .venv-build/bin/pyinstaller packaging/kisshogi.spec --noconfirm --clean
      - name: Smoke
        run: |
          set +e
          .venv-build/bin/python scripts/smoke.py dist/kisshogi > smoke.log 2>&1
          code=$?
          cat smoke.log
          if [ $code -ne 0 ]; then
            echo "::error::$(tail -c 1800 smoke.log | tr '\n' ' ')"
            exit $code
          fi

  windows-native-package:
    name: Windows native package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build onefile
        run: |
          python -m pip install -U pip
          pip install -e ".[native]"
          pip install pyinstaller
          pyinstaller packaging/kisshogi.spec --noconfirm --clean
      - name: Smoke
        shell: pwsh
        run: |
          python scripts/smoke.py dist/kisshogi.exe *> smoke.log
          $code = $LASTEXITCODE
          Get-Content smoke.log
          if ($code -ne 0) {
            $tail = (Get-Content smoke.log -Tail 40) -join " "
            Write-Output "::error::$tail"
            exit $code
          }
