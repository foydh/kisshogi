name: Cleanup old releases

on:
  push:
    paths:
      - .github/workflows/cleanup-old-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.1.3 release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.3 --repo foydh/kisshogi --yes --cleanup-tag || echo "no v0.1.3 release"
